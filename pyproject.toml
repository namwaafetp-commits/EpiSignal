[project]
name = "episignal-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "episignal-api",
  "episignal-backend",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.uv.workspace]
members = ["apps/api", "packages/backend"]

[tool.uv.sources]
episignal-api = { workspace = true }
episignal-backend = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/backend/tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["episignal_api", "episignal_backend"]
