services:
  episignal-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      EPISIGNAL_ENV: production
      EPISIGNAL_API_HOST: 0.0.0.0
      EPISIGNAL_API_PORT: "8000"
      EPISIGNAL_DATABASE_URL: ${EPISIGNAL_DATABASE_URL:?EPISIGNAL_DATABASE_URL is required}
      EPISIGNAL_CORS_ORIGINS: ${EPISIGNAL_CORS_ORIGINS:?EPISIGNAL_CORS_ORIGINS is required}
      EPISIGNAL_LOG_LEVEL: ${EPISIGNAL_LOG_LEVEL:-INFO}
      EPISIGNAL_OPENROUTER_API_KEY: ${EPISIGNAL_OPENROUTER_API_KEY:-}
      EPISIGNAL_OPENROUTER_BASE_URL: ${EPISIGNAL_OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      EPISIGNAL_GEMINI_API_KEY: ${EPISIGNAL_GEMINI_API_KEY:-}
      EPISIGNAL_GEMINI_BASE_URL: ${EPISIGNAL_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      EPISIGNAL_REVIEW_ADMIN_TOKEN: ${EPISIGNAL_REVIEW_ADMIN_TOKEN:-}
      EPISIGNAL_GDELT_POLL_INTERVAL_MINUTES: ${EPISIGNAL_GDELT_POLL_INTERVAL_MINUTES:-15}
      EPISIGNAL_GDELT_QUERY_WINDOW_MINUTES: ${EPISIGNAL_GDELT_QUERY_WINDOW_MINUTES:-20}
      EPISIGNAL_GDELT_MAX_ARTICLES_PER_RUN: ${EPISIGNAL_GDELT_MAX_ARTICLES_PER_RUN:-200}
      EPISIGNAL_GDELT_REQUEST_DELAY_SECONDS: ${EPISIGNAL_GDELT_REQUEST_DELAY_SECONDS:-5.0}
      EPISIGNAL_GDELT_ARTICLE_DELAY_SECONDS: ${EPISIGNAL_GDELT_ARTICLE_DELAY_SECONDS:-1.0}
      EPISIGNAL_GDELT_ARTICLE_TIMEOUT_SECONDS: ${EPISIGNAL_GDELT_ARTICLE_TIMEOUT_SECONDS:-15.0}
      EPISIGNAL_GDELT_MAX_RETRIEVAL_ATTEMPTS: ${EPISIGNAL_GDELT_MAX_RETRIEVAL_ATTEMPTS:-3}
      EPISIGNAL_GDELT_RETRY_BATCH_SIZE: ${EPISIGNAL_GDELT_RETRY_BATCH_SIZE:-50}
      EPISIGNAL_GDELT_USER_AGENT: ${EPISIGNAL_GDELT_USER_AGENT:-EpiSignal/0.1 (+https://episignal.org)}
      EPISIGNAL_AI_SIGNAL_BATCH_LIMIT: ${EPISIGNAL_AI_SIGNAL_BATCH_LIMIT:-100}
      EPISIGNAL_AI_TRIAGE_BATCH_LIMIT: ${EPISIGNAL_AI_TRIAGE_BATCH_LIMIT:-200}
      EPISIGNAL_AI_BATCH_SIZE: ${EPISIGNAL_AI_BATCH_SIZE:-20}
      EPISIGNAL_AI_MAX_REQUESTS_PER_RUN: ${EPISIGNAL_AI_MAX_REQUESTS_PER_RUN:-200}
      EPISIGNAL_AI_MAX_COST_USD_PER_RUN: ${EPISIGNAL_AI_MAX_COST_USD_PER_RUN:-0.50}
      EPISIGNAL_AI_MIN_CONFIDENCE: ${EPISIGNAL_AI_MIN_CONFIDENCE:-0.60}
      EPISIGNAL_AI_MAX_INPUT_CHARACTERS: ${EPISIGNAL_AI_MAX_INPUT_CHARACTERS:-12000}
      EPISIGNAL_AI_REQUEST_DELAY_SECONDS: ${EPISIGNAL_AI_REQUEST_DELAY_SECONDS:-1.0}
      EPISIGNAL_AI_REQUEST_TIMEOUT_SECONDS: ${EPISIGNAL_AI_REQUEST_TIMEOUT_SECONDS:-60.0}
      EPISIGNAL_AI_MAX_ATTEMPTS_PER_TIER: ${EPISIGNAL_AI_MAX_ATTEMPTS_PER_TIER:-3}
      EPISIGNAL_AI_MAX_TIER: ${EPISIGNAL_AI_MAX_TIER:-3}
      EPISIGNAL_AI_EXTRACTION_WORKERS: ${EPISIGNAL_AI_EXTRACTION_WORKERS:-8}
      EPISIGNAL_STAGE0_TITLE_SIMILARITY: ${EPISIGNAL_STAGE0_TITLE_SIMILARITY:-0.90}
      EPISIGNAL_STAGE0_BODY_SIMILARITY: ${EPISIGNAL_STAGE0_BODY_SIMILARITY:-0.80}
      EPISIGNAL_STAGE0_SHINGLE_SIZE: ${EPISIGNAL_STAGE0_SHINGLE_SIZE:-5}
      EPISIGNAL_STAGE0_CANDIDATE_WINDOW_HOURS: ${EPISIGNAL_STAGE0_CANDIDATE_WINDOW_HOURS:-72}
      EPISIGNAL_STAGE0_BATCH_SIZE: ${EPISIGNAL_STAGE0_BATCH_SIZE:-200}
      EPISIGNAL_STAGE0_NEAR_EXACT_TITLE_SIMILARITY: ${EPISIGNAL_STAGE0_NEAR_EXACT_TITLE_SIMILARITY:-92.0}
      EPISIGNAL_STAGE0_NEAR_EXACT_WINDOW_HOURS: ${EPISIGNAL_STAGE0_NEAR_EXACT_WINDOW_HOURS:-48}
      EPISIGNAL_EMBEDDING_MODEL: ${EPISIGNAL_EMBEDDING_MODEL:-BAAI/bge-m3}
      EPISIGNAL_EMBEDDING_PROVIDER: ${EPISIGNAL_EMBEDDING_PROVIDER:-local}
      EPISIGNAL_EMBEDDING_BATCH_SIZE: ${EPISIGNAL_EMBEDDING_BATCH_SIZE:-16}
      EPISIGNAL_GEOCODE_BATCH_SIZE: ${EPISIGNAL_GEOCODE_BATCH_SIZE:-200}
      EPISIGNAL_GEOCODE_MAX_SIGNALS_PER_RUN: ${EPISIGNAL_GEOCODE_MAX_SIGNALS_PER_RUN:-2000}
      EPISIGNAL_GAZETTEER_SOURCE: ${EPISIGNAL_GAZETTEER_SOURCE:-geonames-2026-08-27}
      EPISIGNAL_NOMINATIM_ENABLED: ${EPISIGNAL_NOMINATIM_ENABLED:-false}
      EPISIGNAL_NOMINATIM_URL: ${EPISIGNAL_NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      EPISIGNAL_NOMINATIM_TIMEOUT_SECONDS: ${EPISIGNAL_NOMINATIM_TIMEOUT_SECONDS:-10.0}
      EPISIGNAL_NOMINATIM_USER_AGENT: ${EPISIGNAL_NOMINATIM_USER_AGENT:-EpiSignal/0.1 (episignal backend)}
      EPISIGNAL_EVENT_CLUSTER_WINDOW_DAYS: ${EPISIGNAL_EVENT_CLUSTER_WINDOW_DAYS:-7}
      EPISIGNAL_EVENT_CLUSTER_DISTANCE_KM: ${EPISIGNAL_EVENT_CLUSTER_DISTANCE_KM:-50.0}
      EPISIGNAL_EVENT_MATCH_THRESHOLD: ${EPISIGNAL_EVENT_MATCH_THRESHOLD:-0.60}
      EPISIGNAL_EVENT_MATCH_RECENCY_DAYS: ${EPISIGNAL_EVENT_MATCH_RECENCY_DAYS:-90.0}
      EPISIGNAL_EVENT_MATCH_DISTANCE_KM: ${EPISIGNAL_EVENT_MATCH_DISTANCE_KM:-50.0}
      EPISIGNAL_EVENT_MATCH_BATCH_SIZE: ${EPISIGNAL_EVENT_MATCH_BATCH_SIZE:-100}
      EPISIGNAL_EVENT_MATCH_STALE: ${EPISIGNAL_EVENT_MATCH_STALE:-false}
      EPISIGNAL_EVENT_LOOKBACK_DAYS: ${EPISIGNAL_EVENT_LOOKBACK_DAYS:-7}
      EPISIGNAL_EVENT_CANDIDATE_LIMIT: ${EPISIGNAL_EVENT_CANDIDATE_LIMIT:-20}
      EPISIGNAL_EVENT_FOLLOWUP_WINDOW_DAYS: ${EPISIGNAL_EVENT_FOLLOWUP_WINDOW_DAYS:-10.0}
      EPISIGNAL_EVENT_MATCH_REVIEW_THRESHOLD: ${EPISIGNAL_EVENT_MATCH_REVIEW_THRESHOLD:-0.55}
      EPISIGNAL_EVENT_MATCH_JUDGE_BATCH_SIZE: ${EPISIGNAL_EVENT_MATCH_JUDGE_BATCH_SIZE:-20}
      EPISIGNAL_RESUMMARY_NEW_ARTICLE_COUNT: ${EPISIGNAL_RESUMMARY_NEW_ARTICLE_COUNT:-3}
      EPISIGNAL_RESUMMARY_MAX_AGE_HOURS: ${EPISIGNAL_RESUMMARY_MAX_AGE_HOURS:-24}
      EPISIGNAL_SUMMARY_MAX_SOURCES: ${EPISIGNAL_SUMMARY_MAX_SOURCES:-6}
      EPISIGNAL_PIPELINE_CATCH_UP_MAX_MINUTES: ${EPISIGNAL_PIPELINE_CATCH_UP_MAX_MINUTES:-10080}
      EPISIGNAL_PIPELINE_CHAIN: ${EPISIGNAL_PIPELINE_CHAIN:-daily}
      EPISIGNAL_PREGROUP_ENABLED: ${EPISIGNAL_PREGROUP_ENABLED:-false}
      EPISIGNAL_PREGROUP_WINDOW_DAYS: ${EPISIGNAL_PREGROUP_WINDOW_DAYS:-1}
      EPISIGNAL_PREGROUP_EXPIRY_HOURS: ${EPISIGNAL_PREGROUP_EXPIRY_HOURS:-72}
      EPISIGNAL_PREGROUP_BATCH_SIZE: ${EPISIGNAL_PREGROUP_BATCH_SIZE:-200}
    expose:
      - "8000"
    networks:
      - episignal_proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: episignal_proxy
      traefik.http.routers.episignal-api.rule: Host(`${EPISIGNAL_API_HOST:?EPISIGNAL_API_HOST is required}`)
      traefik.http.routers.episignal-api.entrypoints: websecure
      traefik.http.routers.episignal-api.tls: "true"
      traefik.http.routers.episignal-api.tls.certresolver: mytlschallenge
      traefik.http.services.episignal-api.loadbalancer.server.port: "8000"

  episignal-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_EPISIGNAL_API_URL: ${NEXT_PUBLIC_EPISIGNAL_API_URL:?NEXT_PUBLIC_EPISIGNAL_API_URL is required}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    networks:
      - episignal_proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: episignal_proxy
      traefik.http.routers.episignal-web.rule: Host(`${EPISIGNAL_WEB_HOST:?EPISIGNAL_WEB_HOST is required}`)
      traefik.http.routers.episignal-web.entrypoints: websecure
      traefik.http.routers.episignal-web.tls: "true"
      traefik.http.routers.episignal-web.tls.certresolver: mytlschallenge
      traefik.http.services.episignal-web.loadbalancer.server.port: "3000"

networks:
  episignal_proxy:
    external: true
    name: episignal_proxy
